service: Microsoft Authenticator
source_url: https://learn.microsoft.com/en-us/microsoft-365/enterprise/urls-and-ip-address-ranges
fetch:
  type: json_endpoint
  url: https://endpoints.office.com/endpoints/worldwide?ClientRequestId=c286f1ab-b0ae-40d1-80be-d119d88bfa9f
  domain_keys: [urls]
  filter: serviceArea=Common
  # Hand-curated extras for services the Microsoft 365 endpoints catalog
  # doesn't cover (or that live in serviceArea=Skype/Exchange, not Common).
  # The Microsoft Authenticator app needs these for the "location" map
  # shown during MFA approval, push notifications, the post-approval
  # auth-response POST, and Microsoft account broker services.
  extra_urls:
    # Authenticator push notifications and images
    - "*.msftauth.net"
    - "*.msftauthimages.net"
    # MSAL identity services (used by Authenticator for sign-in)
    - "*.msftidentity.com"
    - "*.msidentity.com"
    # Bing services (the Authenticator "location" feature is rendered
    # by the Bing Maps Android SDK; without these the map screen hangs)
    - "*.bing.com"
    - "platform.bing.com"
    # Bing Maps tile servers (the apex virtualearth.net doesn't resolve
    # via public DNS, so we list each t0..t7 sub-server explicitly)
    - "t0.tiles.virtualearth.net"
    - "t1.tiles.virtualearth.net"
    - "t2.tiles.virtualearth.net"
    - "t3.tiles.virtualearth.net"
    - "t4.tiles.virtualearth.net"
    - "t5.tiles.virtualearth.net"
    - "t6.tiles.virtualearth.net"
    - "t7.tiles.virtualearth.net"
    # Office family — the Authenticator app contacts these during sign-in
    # context (work/school account broker, token acquisition, etc.). These
    # live in the catalog's Skype serviceArea, not Common.
    - "*.office.com"
    - "*.office.net"
    - "*.office365.com"
    # Azure family — Entra ID device registration, app service backends,
    # and CDN/edge services that the broker or app-update flow may use.
    - "*.azure.com"
    - "*.windows.net"
    - "*.azureedge.net"
    - "*.azurefd.net"
    - "*.cloudapp.net"
output_section: Microsoft Authenticator
