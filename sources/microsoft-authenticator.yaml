service: Microsoft Authenticator
source_url: https://learn.microsoft.com/en-us/microsoft-365/enterprise/urls-and-ip-address-ranges
fetch:
  type: json_endpoint
  url: https://endpoints.office.com/endpoints/worldwide?ClientRequestId=c286f1ab-b0ae-40d1-80be-d119d88bfa9f
  domain_keys: [urls]
  filter: serviceArea=Common
  # Hand-curated extras for services the Microsoft 365 endpoints catalog
  # doesn't cover (or that live in serviceArea=Skype/Exchange, not Common).
  # The Microsoft Authenticator app needs these for the "location" map
  # shown during MFA approval, push notifications, the post-approval
  # auth-response POST, and Microsoft account broker services.
  extra_urls:
    # Authenticator push notifications and images
    - "*.msftauth.net"
    - "*.msftauthimages.net"
    # MSAL identity services (used by Authenticator for sign-in)
    - "*.msftidentity.com"
    - "*.msidentity.com"
    # Bing services (the Authenticator "location" feature is rendered
    # by the Bing Maps Android SDK; without these the map screen hangs)
    - "*.bing.com"
    - "platform.bing.com"
    # Bing Maps tile servers (the apex virtualearth.net doesn't resolve
    # via public DNS, so we list each t0..t7 sub-server explicitly)
    - "t0.tiles.virtualearth.net"
    - "t1.tiles.virtualearth.net"
    - "t2.tiles.virtualearth.net"
    - "t3.tiles.virtualearth.net"
    - "t4.tiles.virtualearth.net"
    - "t5.tiles.virtualearth.net"
    - "t6.tiles.virtualearth.net"
    - "t7.tiles.virtualearth.net"
    # Office family — the Authenticator app contacts these during sign-in
    # context (work/school account broker, token acquisition, etc.). These
    # live in the catalog's Skype serviceArea, not Common.
    - "*.office.com"
    - "*.office.net"
    - "*.office365.com"
    # Azure family — Entra ID device registration, app service backends,
    # and CDN/edge services that the broker or app-update flow may use.
    - "*.azure.com"
    - "*.windows.net"
    - "*.azureedge.net"
    - "*.azurefd.net"
    - "*.cloudapp.net"
    # Microsoft push-notification + app-communicator hosts. These are NOT
    # in the Microsoft 365 endpoints catalog. The Authenticator app receives
    # the MFA challenge over Microsoft's push fabric and returns the signed
    # approval through a separate app-communicator host — which is why
    # blocking them yields "approve succeeds but the app never gets the
    # data back" rather than a missing challenge.
    #   mobileappcommunicator.auth.microsoft.com — app communicator (the
    #     approval/response return path). CNAMEs to prda.aadg.msidentity.com
    #     and www.tm.a.prd.aadg.akadns.net, both covered below.
    - "mobileappcommunicator.auth.microsoft.com"
    - "*.akadns.net"
    #   Azure Notification Hubs / Service Bus — push delivery fabric.
    - "*.servicebus.windows.net"
    #   WNS (Windows Notification Service) — push channel registration.
    - "*.notify.windows.com"
    # Google Firebase Cloud Messaging (FCM) — the upstream channel the
    # Authenticator Android app uses to RETURN the approval to Microsoft.
    # Hostnames are Google's officially published FCM allowlist
    # (firebase.google.com/docs/cloud-messaging/network-configuration).
    # Without mtalk.* the push arrives but the response cannot be sent back.
    - "mtalk.google.com"
    - "mtalk4.google.com"
    - "mtalk-staging.google.com"
    - "mtalk-dev.google.com"
    - "alt1-mtalk.google.com"
    - "alt2-mtalk.google.com"
    - "alt3-mtalk.google.com"
    - "alt4-mtalk.google.com"
    - "alt5-mtalk.google.com"
    - "alt6-mtalk.google.com"
    - "alt7-mtalk.google.com"
    - "alt8-mtalk.google.com"
    - "fcm.googleapis.com"
    - "firebaseinstallations.googleapis.com"
    - "android.apis.google.com"
    - "device-provisioning.googleapis.com"
    # Legacy GCM/XMPP upstream hosts — deprecated by Google, but the
    # Authenticator app may still target them on older Android builds.
    - "gcm.googleapis.com"
    - "gcm-http.googleapis.com"
    - "gcm-xmpp.googleapis.com"
    - "fcm-xmpp.googleapis.com"
output_section: Microsoft Authenticator
